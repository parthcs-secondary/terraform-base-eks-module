cluster:
  name: opensearch-poc

  general:
    version: "3"
    serviceName: opensearch-poc
    setVMMaxMapCount: true
  confMgmt:
    smartScaler: false

  dashboards:
    enable: true
    replicas: 1
    version: "3"
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tls:
      enable: false

  nodePools:
    - component: masters
      replicas: 1
      diskSize: 10Gi
      jvm: -Xms512m -Xmx512m
      roles: # The roles the nodes should have
        - "cluster_manager"
        - "data"
      persistence:
        pvc:
          storageClass: gp3
          accessModes:
            - ReadWriteOnce
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 1536Mi

  security:
    config:
      adminCredentialsSecret:
        name: opensearch-poc-admin-credentials
    tls:
      http:
        enabled: true
        generate: true
      transport:
        enabled: true
        generate: true
        perNode: true
