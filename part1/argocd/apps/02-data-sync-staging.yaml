apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-sync-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/parthcs-secondary/terraform-base-eks-module.git
    targetRevision: brightedge
    path: helm/charts/data-sync
    helm:
      valueFiles:
        - values.staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data-sync-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true