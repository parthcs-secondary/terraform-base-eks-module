apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-test-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/test-repo-app/test-org-repo.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: test-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
