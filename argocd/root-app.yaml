apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/parthcs-secondary/terraform-base-eks-module.git
    targetRevision: zaidyn
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
