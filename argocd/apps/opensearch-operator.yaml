apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://opensearch-project.github.io/opensearch-k8s-operator/
      chart: opensearch-operator
      targetRevision: 3.0.2
      helm:
        valueFiles:
          - $values/platform/opensearch-operator/values/operator.yaml
    - repoURL: https://github.com/parthcs-secondary/terraform-base-eks-module.git
      targetRevision: zaidyn
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
